[workspace]
exclude = ["scripts"]
members = [
  "crates/redoubt",
  "crates/redoubt-zero",
  "crates/redoubt-zero/core",
  "crates/redoubt-zero/derive",
  "crates/redoubt-aead",
  "crates/redoubt-aead/crates/aegis128l",
  "crates/redoubt-aead/crates/core",
  "crates/redoubt-aead/crates/chacha",
  "crates/redoubt-aead/crates/poly1305",
  "crates/redoubt-aead/crates/xchachapoly1305",
  "crates/redoubt-secret",
  "crates/redoubt-rand",
  "crates/redoubt-hkdf",
  "crates/redoubt-util",
  "crates/redoubt-vault",
  "crates/redoubt-vault/core",
  "crates/redoubt-vault/derive",
  "crates/redoubt-alloc",
  "crates/redoubt-asm",
  "crates/redoubt-codec",
  "crates/redoubt-codec/core",
  "crates/redoubt-codec/derive",
  "crates/redoubt-buffer",
  "crates/redoubt-test-utils",
  "crates/redoubt-forensics",
  "crates/redoubt-mem",
  "examples/wasm/rust",
  "examples/wallet",
  "benchmarks",
  "forensics/memory_analysis",
  "canary/a",
  "canary/b",
]
resolver = "2"

  [workspace.package]
  edition    = "2024"
  license    = "GPL-3.0-only"
  readme     = "README.md"
  repository = "https://github.com/memparanoid/redoubt"
  version    = "0.1.0-rc.8"

  [workspace.dependencies]
  # Internal crates
  redoubt                      = { path = "crates/redoubt", version = "0.1.0-rc.8" }
  redoubt-aead                 = { path = "crates/redoubt-aead", version = "0.1.0-rc.8" }
  redoubt-aead-aegis128l       = { path = "crates/redoubt-aead/crates/aegis128l", version = "0.1.0-rc.8" }
  redoubt-aead-core            = { path = "crates/redoubt-aead/crates/core", version = "0.1.0-rc.8" }
  redoubt-aead-xchachapoly1305 = { path = "crates/redoubt-aead/crates/xchachapoly1305", version = "0.1.0-rc.8" }
  redoubt-alloc                = { path = "crates/redoubt-alloc", version = "0.1.0-rc.8" }
  redoubt-asm                  = { path = "crates/redoubt-asm", version = "0.1.0-rc.8" }
  redoubt-buffer               = { path = "crates/redoubt-buffer", version = "0.1.0-rc.8" }
  redoubt-chacha               = { path = "crates/redoubt-aead/crates/chacha", version = "0.1.0-rc.8" }
  redoubt-codec                = { path = "crates/redoubt-codec", version = "0.1.0-rc.8" }
  redoubt-codec-core           = { path = "crates/redoubt-codec/core", version = "0.1.0-rc.8" }
  redoubt-codec-derive         = { path = "crates/redoubt-codec/derive", version = "0.1.0-rc.8" }
  redoubt-forensics            = { path = "crates/redoubt-forensics", version = "0.1.0-rc.8" }
  redoubt-hkdf                 = { path = "crates/redoubt-hkdf", version = "0.1.0-rc.8" }
  redoubt-mem                  = { path = "crates/redoubt-mem", version = "0.1.0-rc.8" }
  redoubt-poly1305             = { path = "crates/redoubt-aead/crates/poly1305", version = "0.1.0-rc.8" }
  redoubt-rand                 = { path = "crates/redoubt-rand", version = "0.1.0-rc.8" }
  redoubt-secret               = { path = "crates/redoubt-secret", version = "0.1.0-rc.8" }
  redoubt-test-utils           = { path = "crates/redoubt-test-utils", version = "0.1.0-rc.8" }
  redoubt-util                 = { path = "crates/redoubt-util", version = "0.1.0-rc.8" }
  redoubt-vault                = { path = "crates/redoubt-vault", version = "0.1.0-rc.8" }
  redoubt-vault-core           = { path = "crates/redoubt-vault/core", version = "0.1.0-rc.8" }
  redoubt-vault-derive         = { path = "crates/redoubt-vault/derive", version = "0.1.0-rc.8" }
  redoubt-zero                 = { path = "crates/redoubt-zero", version = "0.1.0-rc.8" }
  redoubt-zero-core            = { path = "crates/redoubt-zero/core", version = "0.1.0-rc.8" }
  redoubt-zero-derive          = { path = "crates/redoubt-zero/derive", version = "0.1.0-rc.8" }

  # External dependencies
  cpufeatures      = "0.2.17"
  getrandom        = "0.3.4"
  heck             = "0.5"
  libc             = "0.2.177"
  pastey           = "0.2.0"
  proc-macro-crate = "3.4.0"
  proc-macro2      = "1.0.103"
  quote            = "1.0.41"
  rand             = "0.9.2"
  rand_core        = "0.9"
  seq-macro        = "0.3.6"
  smallvec         = "1.15.1"
  subtle           = "2.6"
  syn              = "2.0.108"
  thiserror        = "2.0.16"

  # Build dependencies
  cc = "1.2.49"

  # Dev dependencies (used via [dev-dependencies] in individual crates)
  criterion    = "0.5"
  libseccomp   = "0.4.0"
  num-bigint   = "0.5.1"
  prettyplease = "0.2.37"
  proptest     = "1.9.0"
  rstest       = "0.27.0"
  trybuild     = "1.0"

# The SHAVS Monte Carlo is a hundred thousand chained digests per backend, and
# unoptimized it is minutes of every `cargo test`. Optimized here and nowhere
# else: the debug assertions stay on, which is what the dev profile is for.
[profile.dev.package.redoubt-hkdf]
opt-level = 3

[profile.dev.package.redoubt-mem]
opt-level = 3

[profile.dev.package.redoubt-util]
opt-level = 3

[profile.dev.package.redoubt-zero]
opt-level = 3

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3

[profile.bench]
inherits = "release"
