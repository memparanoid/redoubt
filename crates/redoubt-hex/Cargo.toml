[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "encoding", "no-std"]
description          = "Bytes to hex and back in constant time, leaving nothing in a register"
edition.workspace    = true
keywords             = ["security", "hex", "constant-time", "zeroize", "registers"]
license.workspace    = true
name                 = "redoubt-hex"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[features]
# What `scripts/constant-time.sh` turns on, and nothing else. `crabgrind`
# generates its bindings with `bindgen`, so a build that carried it would ask
# every machine for libclang to run an ordinary test.
constant-time = ["dep:crabgrind"]

[dependencies]
redoubt-asm.workspace = true
thiserror.workspace   = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
crabgrind = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
proptest.workspace          = true
redoubt-forensics.workspace = true
redoubt-mem.workspace       = true
rstest.workspace            = true
