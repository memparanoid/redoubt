[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "memory-management"]
description          = "Encrypted vault with field-level access and automatic zeroization"
edition.workspace    = true
keywords             = ["vault", "encryption", "secrets", "aead", "zeroize"]
license.workspace    = true
name                 = "redoubt-vault"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[features]
default            = []
internal-forensics = ["redoubt-vault-core/internal-forensics"]
std                = ["redoubt-vault-core/std", "redoubt-vault-derive/std"]
test-utils         = ["redoubt-vault-core/test-utils"]

[dependencies]
redoubt-vault-core.workspace   = true
redoubt-vault-derive.workspace = true

[dev-dependencies]
# Itself, with the failure injection on. The boxes in
# `tests/failure_injection.rs` name `test-utils` as their testing feature, and
# a feature named there is read against this package — so nothing but this
# turns it on for a test target.
redoubt-vault               = { path = ".", features = ["test-utils"] }

redoubt-aead.workspace      = true
redoubt-alloc.workspace     = true
redoubt-codec.workspace     = true
redoubt-forensics.workspace = true
redoubt-mem.workspace       = true
redoubt-secret.workspace    = true
redoubt-zero.workspace      = true
