[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "HKDF-SHA256, in Rust and by hand, with one seam between them"
edition.workspace    = true
keywords             = ["hkdf", "sha256", "crypto", "security"]
license.workspace    = true
name                 = "redoubt-hkdf"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[features]
# Publishes this crate's SHA-256 for a crate above to use in its own tests.
# Nothing that ships turns it on.
test-utils = []

# What `scripts/constant-time.sh` turns on, and nothing else. `crabgrind`
# generates its bindings with `bindgen`, so a build that carried it would ask
# every machine for libclang to run an ordinary test.
constant-time = ["dep:crabgrind"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
crabgrind = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[dependencies]
redoubt-asm.workspace  = true
redoubt-mem.workspace  = true
redoubt-zero.workspace = true
thiserror.workspace    = true

[dev-dependencies]
proptest.workspace          = true
redoubt-forensics.workspace = true
rstest.workspace            = true
