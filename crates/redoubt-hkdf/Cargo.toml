[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "HKDF-SHA256, in Rust and by hand, with one seam between them"
edition.workspace    = true
keywords             = ["hkdf", "sha256", "crypto", "security"]
license.workspace    = true
name                 = "redoubt-hkdf"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[features]
# Publishes this crate's SHA-256 for a crate above to use in its own tests.
# Nothing that ships turns it on.
test-utils = []

[build-dependencies]
cc.workspace = true

[dependencies]
redoubt-asm.workspace  = true
redoubt-mem.workspace  = true
redoubt-util.workspace = true
redoubt-zero.workspace = true
thiserror.workspace    = true

[dev-dependencies]
proptest.workspace          = true
redoubt-forensics.workspace = true
rstest.workspace            = true
