[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "Authenticated encryption, with the algorithm chosen for the machine it runs on"
edition.workspace    = true
keywords             = ["aead", "aegis", "chacha20poly1305", "crypto", "security"]
license.workspace    = true
name                 = "redoubt-aead-v2"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[dependencies]
redoubt-aead-aegis128l.workspace       = true
redoubt-aead-v2-core.workspace         = true
redoubt-aead-xchachapoly1305.workspace = true
redoubt-codec.workspace                = true
redoubt-rand.workspace                 = true
redoubt-util.workspace                 = true
redoubt-zero.workspace                 = true
thiserror.workspace                    = true

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cpufeatures.workspace = true

[dev-dependencies]
proptest.workspace          = true
redoubt-forensics.workspace = true
redoubt-rand                = { workspace = true, features = ["test-utils"] }
rstest.workspace            = true
