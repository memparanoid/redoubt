[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "Cross-platform cryptographic random number generation"
edition.workspace    = true
keywords             = ["random", "crypto", "getrandom", "security", "rng"]
license.workspace    = true
name                 = "redoubt-rand"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[dependencies]
getrandom.workspace   = true
redoubt-asm.workspace = true
redoubt-mem           = { workspace = true, optional = true }
thiserror.workspace   = true

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
libc.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
proptest.workspace           = true
redoubt-forensics.workspace  = true
redoubt-mem.workspace        = true
redoubt-test-utils.workspace = true
rstest.workspace             = true

[features]
test-utils = ["dep:redoubt-mem"]
