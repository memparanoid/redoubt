[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "Cross-platform cryptographic random number generation"
edition.workspace    = true
keywords             = ["random", "crypto", "getrandom", "security", "rng"]
license.workspace    = true
name                 = "redoubt-rand"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[dependencies]
redoubt-asm.workspace  = true
redoubt-hkdf.workspace = true
redoubt-zero.workspace = true
thiserror.workspace    = true

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
libc.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
getrandom.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
proptest.workspace          = true
redoubt-forensics.workspace  = true
redoubt-mem.workspace        = true
redoubt-test-utils.workspace = true
rstest.workspace             = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libseccomp.workspace = true

[features]
test-utils = []
