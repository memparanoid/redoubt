[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "XChaCha20-Poly1305 with guaranteed zeroization"
edition.workspace    = true
keywords             = ["aead", "xchacha20poly1305", "encryption", "crypto", "zeroize"]
license.workspace    = true
name                 = "redoubt-aead-xchachapoly1305"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[features]
# What `scripts/constant-time.sh` turns on, and nothing else. `crabgrind`
# generates its bindings with `bindgen`, so a build that carried it would ask
# every machine for libclang to run an ordinary test. The core's is what makes
# the tag's answer public to Memcheck.
constant-time = ["dep:crabgrind", "redoubt-aead-core/constant-time"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
crabgrind = { workspace = true, optional = true }

[dependencies]
redoubt-aead-core.workspace = true
redoubt-alloc.workspace     = true
redoubt-asm.workspace       = true
redoubt-chacha.workspace    = true
redoubt-eq.workspace        = true
redoubt-mem.workspace       = true
redoubt-poly1305.workspace  = true
redoubt-zero.workspace      = true

[dev-dependencies]
proptest.workspace          = true
redoubt-forensics.workspace = true
redoubt-hkdf                = { workspace = true, features = ["test-utils"] }
redoubt-util                = { workspace = true, features = ["test-utils"] }
rstest.workspace            = true
