[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "Poly1305 one-time authenticator with guaranteed zeroization"
edition.workspace    = true
keywords             = ["poly1305", "mac", "authenticator", "crypto", "zeroize"]
license.workspace    = true
name                 = "redoubt-poly1305"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[features]
# What `scripts/constant-time.sh` turns on, and nothing else. `crabgrind`
# generates its bindings with `bindgen`, so a build that carried it would ask
# every machine for libclang to run an ordinary test.
constant-time = ["dep:crabgrind"]

[dependencies]
redoubt-aead-core.workspace = true
redoubt-asm.workspace       = true
redoubt-zero.workspace      = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
crabgrind = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
num-bigint.workspace        = true
proptest.workspace          = true
redoubt-forensics.workspace = true
redoubt-mem.workspace       = true
rstest.workspace            = true
