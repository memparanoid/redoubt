[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["cryptography", "no-std"]
description          = "Core traits and error types for AEAD backends"
edition.workspace    = true
keywords             = ["aead", "encryption", "crypto"]
license.workspace    = true
name                 = "redoubt-aead-core"
readme.workspace     = true
repository.workspace = true
version.workspace    = true

[lib]
path = "src/lib.rs"

[features]
test-utils = []

# What `scripts/constant-time.sh` turns on, and nothing else. `crabgrind`
# generates its bindings with `bindgen`, so a build that carried it would ask
# every machine for libclang to run an ordinary test.
constant-time = ["dep:crabgrind"]

[build-dependencies]
cc.workspace = true

[dependencies]
redoubt-asm.workspace = true
thiserror.workspace   = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
crabgrind = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
