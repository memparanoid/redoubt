[package]
authors              = ["Federico Hoerth <memparanoid@gmail.com>"]
categories           = ["development-tools::debugging"]
description          = "Memory forensics tools for Redoubt"
edition.workspace    = true
keywords             = ["forensics", "memory", "analysis", "debugging"]
license.workspace    = true
name                 = "redoubt-forensics"
publish              = false
repository.workspace = true
version.workspace    = true

[[bin]]
name = "redoubt_trace_report"
path = "src/bin/redoubt_trace_report.rs"


[features]
default            = []
internal-forensics = ["redoubt/internal-forensics"]

[dependencies]
redoubt = { workspace = true, features = ["asm"] }

# The dumper reads `/proc/self/{maps,mem}` through raw syscalls, so it only
# exists on Linux. Keeping `libc` off every other target makes that explicit and
# keeps `cargo test --workspace` building on Windows and macOS.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
