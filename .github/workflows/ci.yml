name: CI

# Asked for by hand, for now.
#
# One of these runners crashes a test with a signal and the others do not, and
# every push while that is true spends eight runners on an answer already
# known. Manual until the crash is understood, and then the two triggers below
# come back.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      # One runner while one runner is the question.
      #
      # `Linux aarch64` crashes a test with a signal and the other seven do
      # not, so they are commented rather than removed — every turn of chasing
      # it would otherwise spend eight machines to learn what one of them
      # knows. They come back with the two triggers above.
      matrix:
        include:
          - os: ubuntu-24.04-arm
            name: Linux aarch64
          # - os: ubuntu-latest
          #   name: Linux x86_64
          # - os: macos-latest
          #   name: macOS aarch64
          # The last Intel runner. `macos-latest` has been ARM since 14, so
          # without this the x86_64 half of the AEGIS and SHA-256 assembly is
          # never run on the platform it is written for.
          # - os: macos-13
          #   name: macOS x86_64
          # - os: windows-latest
          #   name: Windows x86_64
          # - os: windows-11-arm
          #   name: Windows aarch64
          # The other C library, on both architectures, in a container rather
          # than cross-compiled: what is being asked about is the allocator,
          # and only a native musl process has musl's.
          #
          # What a freed chunk keeps is the allocator's decision and not the
          # code's. glibc leaves everything past a chunk's first bytes where it
          # was; musl's `mallocng` may cover the lot. The sweeps measure what is
          # left in memory, so the same leak can show under one and not the
          # other.
          # - os: ubuntu-latest
          #   name: Linux x86_64 musl
          #   container: alpine:latest
          # - os: ubuntu-24.04-arm
          #   name: Linux aarch64 musl
          #   container: alpine:latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      # Before anything else, and before `actions/checkout`: every action runs
      # on a node the runner injects, and that node is linked against glibc.
      # `libc6-compat` is what lets it start at all under musl. The rest is
      # what an Alpine image does not ship and the build needs.
      - name: Prepare the container
        if: matrix.container
        run: |
          apk add --no-cache \
            libc6-compat build-base musl-dev \
            libseccomp-dev libseccomp-static \
            git curl bash

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install libseccomp
        if: runner.os == 'Linux' && !matrix.container
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      # Formatting reads the same on every runner, so it is asked once rather
      # than on each.
      - name: cargo fmt --check
        if: matrix.name == 'Linux x86_64'
        run: cargo fmt --all -- --check

      # Clippy is asked everywhere, because it is not the same question
      # everywhere: which code exists at all is decided by `cfg`, and a warning
      # that only appears on one of these is exactly what this matrix is for.
      # `redoubt-aead` selected a backend whose assembly is not built on
      # aarch64 Windows, and nothing here saw it until that runner existed.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # A process per test, which some of these need and all of them benefit
      # from. `redoubt-forensics` reads the whole process's memory: two of its
      # tests in one process are two secrets in one process, and each is the
      # other's needle. Under a shared-process runner they fail for reasons
      # that have nothing to do with the code.
      #
      # It also reports which test took a signal. A segfault under `cargo test`
      # kills the binary and takes every other result with it.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # `--no-fail-fast`, because the first failure is the least interesting
      # thing a run can tell us. What is worth knowing is whether one test
      # failed or every test of a kind did — a single red among a thousand
      # green is a different bug from a whole path giving way, and stopping at
      # the first one makes the two look alike.
      #
      # It costs the minutes between the first failure and the end of the run,
      # on a run that is already going to be looked at by hand.
      - name: cargo nextest run
        run: cargo nextest run --workspace --no-fail-fast

      - name: cargo nextest run --all-features
        run: cargo nextest run --workspace --all-features --no-fail-fast

      # nextest does not run doctests, and this workspace documents its API
      # with runnable examples. Without this they stop being checked.
      #
      # Not on the musl entries: a doctest asks whether the documentation still
      # compiles and answers the same on either C library, so running them
      # again buys minutes and no signal. What differs between the two is the
      # allocator, and that is what the sweeps above are for.
      - name: cargo test --doc
        if: ${{ !matrix.container }}
        run: cargo test --workspace --doc

      - name: cargo test --doc --all-features
        if: ${{ !matrix.container }}
        run: cargo test --workspace --all-features --doc
