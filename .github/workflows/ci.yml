name: CI

# Asked for by hand, until a full run of the matrix has been read once. The two
# triggers below come back with it.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            name: Linux aarch64
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS aarch64
          # The last Intel runner. `macos-latest` has been ARM since 14, so
          # without this the x86_64 half of the AEGIS and SHA-256 assembly is
          # never run on the platform it is written for.
          - os: macos-13
            name: macOS x86_64
          - os: windows-latest
            name: Windows x86_64
          - os: windows-11-arm
            name: Windows aarch64
          # The other C library is the `musl` job below, which runs no actions
          # at all and so has to say everything for itself.

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install libseccomp
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev

      # Formatting reads the same on every runner, so it is asked once rather
      # than on each.
      - name: cargo fmt --check
        if: matrix.name == 'Linux x86_64'
        run: cargo fmt --all -- --check

      # Clippy is asked everywhere, because it is not the same question
      # everywhere: which code exists at all is decided by `cfg`, and a warning
      # that only appears on one of these is exactly what this matrix is for.
      # `redoubt-aead` selected a backend whose assembly is not built on
      # aarch64 Windows, and nothing here saw it until that runner existed.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # A process per test, which some of these need and all of them benefit
      # from. `redoubt-forensics` reads the whole process's memory: two of its
      # tests in one process are two secrets in one process, and each is the
      # other's needle. Under a shared-process runner they fail for reasons
      # that have nothing to do with the code.
      #
      # It also reports which test took a signal. A segfault under `cargo test`
      # kills the binary and takes every other result with it.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # Both profiles, because they leave different things behind and neither
      # covers the other. Debug spills every local to the stack; release is what
      # vectorises a copy and leaves a secret in the wide registers nothing else
      # writes. A sweep reads whatever is there, so a crate that is clean under
      # one is not thereby clean under the other.
      #
      # Linux alone runs the debug half. It is the same question everywhere and
      # the slowest runners are the ones that would answer it last.
      #
      # `--no-fail-fast`, because the first failure is the least interesting
      # thing a run can tell us. What is worth knowing is whether one test
      # failed or every test of a kind did — a single red among a thousand green
      # is a different bug from a whole path giving way, and stopping at the
      # first one makes the two look alike.
      #
      # `--success-output`, because one of these tests answers a question about
      # the machine rather than about the code: whether `ptrace` is there, and
      # so whether a photograph on it is a third process or the analyst reading
      # itself. Nothing else says which of the two a run took.
      - name: cargo nextest run
        if: runner.os == 'Linux'
        run: cargo nextest run --workspace --no-fail-fast --success-output final

      - name: cargo nextest run --release
        run: cargo nextest run --workspace --release --no-fail-fast

      - name: cargo nextest run --all-features
        run: cargo nextest run --workspace --all-features --release --no-fail-fast

      # nextest does not run doctests, and this workspace documents its API
      # with runnable examples. Without this they stop being checked.
      #
      # Here and not in the `musl` job: a doctest asks whether the documentation
      # still compiles, which answers the same on either C library. What differs
      # between the two is the allocator, and that is what the sweeps are for.
      - name: cargo test --doc
        run: cargo test --workspace --doc

      - name: cargo test --doc --all-features
        run: cargo test --workspace --all-features --doc

  # ==========================================================================
  # The other C library
  # ==========================================================================

  # What a freed chunk keeps is the allocator's decision and not the code's.
  # glibc leaves everything past a chunk's first bytes where it was; musl's
  # `mallocng` may cover the lot. The sweeps measure what is left in memory, so
  # the same leak can show under one and not the other — which is why this is a
  # native musl process and not a cross-compiled binary. Only a musl process
  # has musl's allocator.
  #
  # # Why this job repeats the one above instead of joining its matrix
  #
  # Not one action, on purpose. Every action runs on a node the runner injects
  # into the container, and GitHub ships that node for Alpine on x64 alone — so
  # an `aarch64` entry in the matrix above cannot start at all, whatever it is
  # asked to do. A job whose every step is a shell command needs no node, and
  # runs on both.
  #
  # What that costs is the checkout, the toolchain and nextest written out by
  # hand below. What it buys is the architecture where the assembly lives.
  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64 musl
          - os: ubuntu-24.04-arm
            name: Linux aarch64 musl

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: alpine:latest

    steps:
      # `libseccomp-static` beside the headers: a musl build links statically,
      # and the shared library alone leaves the link with nothing to put in.
      - name: Prepare the container
        run: |
          apk add --no-cache \
            build-base musl-dev \
            libseccomp-dev libseccomp-static \
            git curl bash tar

      # `actions/checkout` by hand. The token is the one the run already has,
      # and the fetch is of the commit itself rather than of a branch — a run
      # reads the tree it was started for, not whatever the branch has moved to
      # since.
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          # The checkout is a directory the container made and git is running
          # as somebody else in it, which git refuses to touch unless told.
          git config --global --add safe.directory "$PWD"

          # `tr` and not `base64 -w0`: the base64 in here is busybox's, which
          # has no such flag and fails the whole step for it.
          header="AUTHORIZATION: basic $(
            printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n'
          )"

          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="$header" fetch --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable \
              --component clippy
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      # Built for this C library and this architecture, because a binary for the
      # other one does not start here — which is the whole point of the job.
      # From source when there is no such binary published, which costs minutes
      # and is still the only way to have it.
      - name: Install nextest
        run: |
          case "$(uname -m)" in
            x86_64) build=linux-musl ;;
            aarch64) build=linux-arm-musl ;;
            *) build= ;;
          esac

          if [ -n "$build" ] &&
            curl -fL "https://get.nexte.st/latest/$build" |
              tar zxf - -C /usr/local/bin; then
            echo "nextest: $build"
          else
            cargo install cargo-nextest --locked
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo nextest run
        run: cargo nextest run --workspace --no-fail-fast --success-output final

      - name: cargo nextest run --release
        run: cargo nextest run --workspace --release --no-fail-fast

      - name: cargo nextest run --all-features
        run: cargo nextest run --workspace --all-features --release --no-fail-fast
